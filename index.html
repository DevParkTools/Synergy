<head>

<title>시너지 제품 계산기</title>
<style>

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5;padding:16px 16px 32px;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.5rem;margin:6px 0 2px;letter-spacing:-.02em}
.desc{margin:0 0 14px;color:var(--sub);font-size:.9rem}
.tabs{position:sticky;top:0;z-index:5;display:flex;background:var(--bg);margin:0 -16px 14px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:1 0 auto;height:46px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--sub);font:inherit;font-size:.95rem;font-weight:600;white-space:nowrap;cursor:pointer}
.tab.on{color:var(--main);border-bottom-color:var(--main)}
.tab:focus-visible,.btn:focus-visible,.step button:focus-visible{outline:2px solid var(--main);outline-offset:-2px}
.intro{margin:0 2px 12px;color:var(--sub);font-size:.88rem}
.info{margin:0 2px 10px;color:var(--sub);font-size:.88rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:12px}
.lb{display:block;margin-bottom:6px;font-size:.84rem;font-weight:600}
.ctl{width:100%;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
.ctl.big{font-size:1.15rem;font-weight:700}
.ctl:focus{outline:2px solid var(--main);outline-offset:1px}
.btn{height:44px;padding:0 20px;border:0;border-radius:10px;background:var(--main);color:#fff;font:inherit;font-weight:700;cursor:pointer;flex:none}
.btn:hover{background:var(--main-d)}
.btn.ghost{height:34px;padding:0 12px;background:none;border:1px solid var(--line);color:var(--sub);font-size:.84rem;font-weight:600}
.btn.ghost:hover{background:var(--hi)}
.inrow{display:flex;gap:8px;align-items:center}
.row2{display:grid;grid-template-columns:1fr 150px;gap:10px}
.suf{color:var(--sub);font-size:.95rem;flex:none}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:.9rem;cursor:pointer;user-select:none}
.opt input{accent-color:var(--main);margin:0}
.opt:has(input:checked){background:var(--hi);border-color:var(--main)}
.opt:focus-within{outline:2px solid var(--main);outline-offset:1px}
.gh{margin:18px 2px 8px;font-size:.9rem;font-weight:700;color:var(--sub)}
.gh:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;margin-bottom:10px}
.card.sm{padding:12px 14px}
.card.top{border-color:var(--main);box-shadow:0 0 0 1px var(--main)}
.card.sel{background:var(--hi);border-color:var(--main)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ct{min-width:0;font-weight:700;line-height:1.4}
.cr{display:flex;align-items:center;gap:6px;flex:none}
.cd{margin-top:4px;color:var(--sub);font-size:.84rem}
.note{margin-top:6px;color:var(--main);font-size:.84rem;font-weight:600}
.mo{margin-top:8px;color:var(--sub);font-size:.84rem}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--hi);color:var(--main);font-size:.76rem;font-weight:700;white-space:nowrap}
.chip.solid{background:var(--main);color:var(--card)}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.card.sm .mt{margin-top:10px;padding-top:10px}
.mt.c2{grid-template-columns:repeat(2,1fr)}
.mt.c4{grid-template-columns:repeat(4,1fr)}
.mt span{display:block;color:var(--sub);font-size:.76rem}
.mt b{display:block;font-size:1rem}
.mt .k b{color:var(--main)}
.sg{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sgt{margin-bottom:4px;color:var(--main);font-size:.88rem;font-weight:700}
.sr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.sgt+.sr{border-top:0}
.sn{font-weight:600}
.sn .chip{margin-left:6px;vertical-align:1px}
.su{color:var(--sub);font-size:.8rem}
.sa{font-weight:600;white-space:nowrap}
.sf{margin-top:6px;padding-top:8px;border-top:1px solid var(--line);color:var(--sub);font-size:.84rem}
.step{display:inline-flex;align-items:center;gap:2px}
.step button{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1.15rem;cursor:pointer}
.qn{min-width:28px;text-align:center;font-weight:700}
.card.sel .qn{color:var(--main)}
.card.sel .chip:not(.solid){background:var(--card)}
.ezsum{position:sticky;top:47px;z-index:4}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--rad);background:var(--card);color:var(--sub);text-align:center}

</style>
</head>

<div class="wrap">
<h1>시너지 제품 계산기</h1>
<p class="desc">회원가 기준으로 제품과 패키지를 추천하고 CV와 마진을 계산합니다.</p>
<nav class="tabs" role="tablist">
<button type="button" class="tab on" data-t="calc" role="tab">계산기</button>
<button type="button" class="tab" data-t="prod" role="tab">제품 가격</button>
<button type="button" class="tab" data-t="pkg" role="tab">패키지</button>
<button type="button" class="tab" data-t="mg" role="tab">원팩</button>
<button type="button" class="tab" data-t="ez" role="tab">이지원</button>
</nav>

<section id="v-calc">
<p class="intro">예산을 입력하면 메가 원팩 16주부터 순서대로 구성을 추천합니다.</p>
<div class="panel">
<label class="lb" for="budget" id="lblBudget">예산 (원)</label>
<div class="inrow">
<input id="budget" class="ctl big" type="text" inputmode="numeric" autocomplete="off" placeholder="예: 1,000,000">
<input id="months" class="ctl big" style="width:76px;flex:none;text-align:center" type="number" inputmode="numeric" min="1" max="60" value="6" aria-label="개월 수" hidden>
<span id="mSuf" class="suf" hidden>개월</span>
<button id="go" class="btn" type="button">계산</button>
</div>
<div class="opts">
<label class="opt"><input type="radio" name="im" value="t" checked>총 금액</label>
<label class="opt"><input type="radio" name="im" value="m">월 금액 × 개월</label>
</div>
</div>
<div id="info" class="info"></div>
<div id="out"></div>
</section>

<section id="v-prod" hidden>
<p class="intro">제품별 소비자가, 회원가, CV입니다.</p>
<div class="panel">
<div class="row2">
<div><label class="lb" for="q">제품 검색</label><input id="q" class="ctl" type="text" autocomplete="off" placeholder="제품명 입력"></div>
<div><label class="lb" for="sortSel">정렬</label><select id="sortSel" class="ctl">
<option value="pop">인기순</option>
<option value="cv">CV 높은순</option>
<option value="cvl">CV 낮은순</option>
<option value="pl">가격 낮은순</option>
<option value="ph">가격 높은순</option>
<option value="name">이름순</option>
<option value="val">가성비순 (CV당 가격)</option>
</select></div>
</div>
</div>
<div id="prodList"></div>
</section>

<section id="v-pkg" hidden>
<p class="intro">공식 패키지의 구성과 가격입니다.</p>
<div id="pkgList"></div>
</section>

<section id="v-mg" hidden>
<p class="intro">마진은 소비자가에서 회원가를 뺀 금액입니다.</p>
<div id="mgOut"></div>
</section>

<section id="v-ez" hidden>
<p class="intro">이지원(정기 구독)은 회원가 기준 10% 할인입니다.</p>
<div class="panel">
<div class="row2">
<div><label class="lb" for="ezq">제품 검색</label><input id="ezq" class="ctl" type="text" autocomplete="off" placeholder="제품명 입력"></div>
<div><label class="lb" for="ezSort">정렬</label><select id="ezSort" class="ctl">
<option value="pop">인기순</option>
<option value="cv">CV 높은순</option>
<option value="cvl">CV 낮은순</option>
<option value="pl">가격 낮은순</option>
<option value="ph">가격 높은순</option>
<option value="name">이름순</option>
<option value="val">가성비순 (CV당 가격)</option>
</select></div>
</div>
</div>
<div id="ezSum" class="card ezsum"></div>
<div id="ezList"></div>
</section>
</div>

function fmt(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");}

function gcd(a,b){
  while(b){var t=a%b;a=b;b=t;}
  return a;
}

function getIm(){
  if(!elIm){return "t";}
  for(var k=0;k<elIm.length;k++){
    if(elIm[k].checked){return elIm[k].value;}
  }

}

function syncIm(){
  var m=getIm()==="m";
  if(elMonths){elMonths.hidden=!m;}
  if(elSuf){elSuf.hidden=!m;}
  if(elLbl){elLbl.textContent=m?"월 금액 (원) × 개월":"예산 (원)";}
  if(elBudget){elBudget.placeholder=m?"예: 300,000":"예: 1,000,000";}
}

function tierOf(n){
  if(n.indexOf("슈퍼")>=0){return 7;}
  if(n.indexOf("메가 원팩 16")>=0){return 1;}
  if(n.indexOf("메가 원팩 12")>=0){return 2;}
  if(n.indexOf("메가 원팩 8")>=0){return 3;}
  if(n.indexOf("메가 원팩 4")>=0){return 4;}
  if(n.indexOf("7일 원팩")>=0){return 5;}
  return 6;
}

function ensureCands(){
  if(candReady){return;}
  for(var i=0;i<N;i++){
    var d=DATA[i];
    if(d&&d[5]>0){
      cName.push(d[0]);cTier.push(tierOf(d[0]));cPay.push(d[5]);cCon.push(d[2]);cMem.push(d[3]);cCv.push(d[1]);cDesc.push(d[4]);cNote.push(d[7]||"");cKind.push(1);
    }
  }
  for(var p=0;p<PROGS.length;p++){
    var r=PROGS[p];
    cName.push(r[0]);cTier.push(tierOf(r[0]));cPay.push(r[2]);cCon.push(r[3]);cMem.push(r[2]);cCv.push(r[4]);cDesc.push(r[5]);cNote.push("");cKind.push(0);
  }
  candReady=true;
}

function prepSingles(){
  sPrice.length=0;sUnit.length=0;sCv.length=0;sName.length=0;sPop.length=0;sCon.length=0;
  g=0;
  for(var i=0;i<SN;i++){
    var row=SINGLES[i];
    if(!row){continue;}
    var p=row[2];
    if(p>0&&row[1]>0){sPrice.push(p);sCv.push(row[3]);sName.push(row[0]);sPop.push(row[4]?1:0);sCon.push(row[1]);g=gcd(g,p);}
  }
  K=sPrice.length;
  if(K===0||g<=0){useSingles=false;return;}
  iUnit.length=0;iCv.length=0;iScore.length=0;iBase.length=0;iMul.length=0;
  for(var k0=0;k0<K;k0++){sUnit[k0]=sPrice[k0]/g;}
  for(var pass=0;pass<2;pass++){
    for(var k=0;k<K;k++){
      var isF=sName[k].indexOf("시너후레쉬")===0;
      if((pass===0)===isF){continue;}
      var w=isF?0:(sPop[k]?POPW:1);
      for(var m=1;m<=2;m++){
        iUnit.push(sUnit[k]*m);iCv.push(sCv[k]*m);iScore.push(sCv[k]*m*w);iBase.push(k);iMul.push(m);
      }
    }
    if(pass===0){tProd=iUnit.length;}
  }
  KI=iUnit.length;
  U=Math.floor(Math.min(budget,CAP)/g);
  var W=U+1;
  dpscore=new Int32Array(W).fill(-1);
  dpreal=new Int32Array(W);
  dpscore[0]=0;
  take=new Uint8Array(KI*W);
  bs=new Int32Array(W);
  bs0=new Int32Array(W);
  dpreal0=new Int32Array(W);
  scnt=new Int32Array(K);
  for(var t=0;t<KI;t++){
    if(t===tProd){snapProd();}
    var u=iUnit[t];
    var cvv=iCv[t];
    var sc=iScore[t];
    var off=t*W;
    for(var s=U;s>=u;s--){
      var pv=dpscore[s-u];
      if(pv>=0){
        var v=pv+sc;
        if(v>dpscore[s]){dpscore[s]=v;dpreal[s]=dpreal[s-u]+cvv;take[off+s]=1;}
      }
    }
  }
  if(tProd>=KI){snapProd();}
  for(var q=1;q<=U;q++){bs[q]=dpscore[q]>=0?q:bs[q-1];}
}

function snapProd(){
  for(var q=1;q<=U;q++){bs0[q]=dpscore[q]>=0?q:bs0[q-1];}
  dpreal0.set(dpreal);
}

function fillCalc(left,cv){
  fRem=left;
  fCv=cv;
  fMode=1;
  if(useSingles){
    var x=Math.floor(left/g);
    if(x>U){x=U;}
    var s0=bs0[x];
    var r0=left-s0*g;
    if(r0<=FILL_OK){
      fMode=0;
      fRem=r0;
      fCv=cv+dpreal0[s0];
    }else{
      var sv=bs[x];
      fRem=left-sv*g;
      fCv=cv+dpreal[sv];
    }
  }
}

function addRec(ci,k,rem,cv,left,mode){
  recC.push(ci);recK.push(k);recRem.push(rem);recCv.push(cv);recLeft.push(left);recMode.push(mode);
}

function buildRecs(){
  recC.length=0;recK.length=0;recRem.length=0;recCv.length=0;recLeft.length=0;recMode.length=0;
  var nc=cPay.length;
  for(var t=1;t<=7&&recC.length<REC_MAX;t++){
    var bi=-1;
    for(var c=0;c<nc;c++){
      if(cTier[c]!==t||cPay[c]>budget){continue;}
      if(bi<0||cCon[c]>cCon[bi]||(cCon[c]===cCon[bi]&&cPay[c]<cPay[bi])){bi=c;}
    }
    if(bi<0){continue;}
    var k=Math.min(Math.floor(budget/cPay[bi]),MAXK);
    var left=budget-k*cPay[bi];
    fillCalc(left,0);
    addRec(bi,k,fRem,fCv,left,fMode);
  }
  if(recC.length===0&&useSingles){
    fillCalc(budget,0);
    if(fCv>0){addRec(-1,0,fRem,fCv,budget,fMode);}
  }
}

function mt(l,v,k){return '<div'+(k?' class="k"':'')+'><span>'+l+'</span><b>'+v+'</b></div>';}

function mts(n,s){return '<div class="mt c'+n+'">'+s+'</div>';}

function won(n){return fmt(n)+'원';}

function buildCard(j){
  var ci=recC[j];
  var k=recK[j];
  var rem=recRem[j];
  var scv=recCv[j];
  var left=recLeft[j];
  var sTot=0;
  var sb="";
  if(useSingles){
    var x=Math.floor(left/g);
    if(x>U){x=U;}
    var sv=recMode[j]===0?bs0[x]:bs[x];
    var tStart=recMode[j]===0?tProd-1:KI-1;
    scnt.fill(0);
    var W=U+1;
    for(var t=tStart;t>=0&&sv>0;t--){
      if(take[t*W+sv]===1){
        scnt[iBase[t]]+=iMul[t];
        sv-=iUnit[t];
      }
    }
    for(var m=0;m<K;m++){
      if(scnt[m]>0){
        sTot+=sPrice[m]*scnt[m];
        sb+='<div class="sr"><div><div class="sn">'+sName[m]+' × '+scnt[m]+(sPop[m]?'<span class="chip">인기</span>':'')+'</div><div class="su">단품 1개 '+won(sPrice[m])+'</div></div><div class="sa">'+won(sPrice[m]*scnt[m])+'</div></div>';
      }
    }
  }
  var hasPkg=ci>=0;
  var total=sTot;
  var cvT=scv;
  var margin=rem;
  var h='<div class="card'+(j===0?' top':'')+'"><div class="ch"><div class="ct">'+(hasPkg?cName[ci]+' × '+k:'단품 구성')+'</div><div class="cr"><span class="chip solid">추천 '+(j+1)+'</span></div></div>';
  if(hasPkg){
    total=cPay[ci]*k;
    cvT=cCv[ci]*k;
    margin=left;
    if(cNote[ci]){h+='<div class="cd">'+cNote[ci]+'</div>';}
    h+='<div class="cd">'+cDesc[ci]+'</div>';
    if(cKind[ci]===1&&cMem[ci]>cPay[ci]){
      h+='<div class="note">패키지가 적용 · 회원가 합계 대비 '+won((cMem[ci]-cPay[ci])*k)+' 절약</div>';
    }
  }
  h+=mts(3,mt('합계',won(total))+mt('총 CV',fmt(cvT))+mt('마진',won(margin),1));
  if(isMonthly&&months>0){h+='<div class="mo">월 평균 '+won(Math.round(total/months))+' · '+months+'개월</div>';}
  if(sb!==""){
    h+='<div class="sg"><div class="sgt">'+(hasPkg?'단품 추가 · 남은 금액 '+won(left):'단품 구성')+'</div>'+sb;
    if(hasPkg){h+='<div class="sf">단품 합계 '+won(sTot)+' · CV +'+fmt(scv)+' · 단품 추가 시 마진 '+won(rem)+'</div>';}
    h+='</div>';
  }
  return h+'</div>';
}

function calc(){
  if(!elBudget||!elOut||!elInfo){return;}
  syncIm();
  isMonthly=getIm()==="m";
  var raw=elBudget.value?elBudget.value.replace(/[^0-9]/g,""):"";
  var val=raw===""?0:parseInt(raw,10);
  if(isMonthly){
    monthly=val;
    months=elMonths?parseInt(elMonths.value,10):0;
    if(!monthly||monthly<=0){showMsg("월 금액을 입력해 주세요.");return;}
    if(!months||months<1){showMsg("개월 수를 입력해 주세요.");return;}
    if(months>60){months=60;}
    budget=monthly*months;
  }else{
    monthly=0;
    months=0;
    budget=val;
    if(!budget||budget<=0){showMsg("예산을 입력해 주세요.");return;}
  }
  ensureCands();
  useSingles=true;
  prepSingles();
  buildRecs();
  elInfo.textContent=isMonthly?"월 "+fmt(monthly)+"원 × "+months+"개월 = 총 "+fmt(budget)+"원 · 회원가 기준":"회원가 기준";
  if(recC.length===0){
    elOut.innerHTML='<div class="empty">추천 가능한 구성이 없습니다. 남은 금액 : '+fmt(budget)+'원</div>';
    return;
  }
  var html="";
  for(var j=0;j<recC.length;j++){html+=buildCard(j);}
  elOut.innerHTML=html;
}

var prodIdx=[];
var ezIdx=[];
var ezQty=new Int32Array(SN);
var PN=PROGS.length;
var MG_GROUPS=["워밍업","체질 개선 프로그램"];
var MG_TITLES=["워밍업","체질 개선 프로그램"];

for(var si=0;si<SN;si++){
  if(SINGLES[si]){
    prodIdx.push(si);
    if(SINGLES[si][2]>0){ezIdx.push(si);}
  }
}

function showTab(n){
  for(var key in views){
    if(views[key]){views[key].hidden=(key!==n);}
  }
  for(var i=0;i<tabBtns.length;i++){
    var on=tabBtns[i].getAttribute("data-t")===n;
    if(on){tabBtns[i].classList.add("on");}else{tabBtns[i].classList.remove("on");}
  }
  if(window.scrollTo){window.scrollTo(0,0);}
}

function norm(t){return t?t.replace(/\s+/g,"").toLowerCase():"";}
function dash(n){return n>0?won(n):"-";}
function vper(r){
  var p=r[2]>0?r[2]:r[1];
  return (r[3]>0&&p>0)?p/r[3]:1000000000;
}

function cmpS(a,b,mode){
  var x=SINGLES[a];
  var y=SINGLES[b];
  var px=x[2]>0?x[2]:x[1];
  var py=y[2]>0?y[2]:y[1];
  var d=0;
  if(mode==="cv"){d=y[3]-x[3];}
  else if(mode==="cvl"){d=x[3]-y[3];}
  else if(mode==="pl"){d=px-py;}
  else if(mode==="ph"){d=py-px;}
  else if(mode==="name"){d=x[0].localeCompare(y[0],"ko");}
  else if(mode==="val"){d=vper(x)-vper(y);}
  else{d=(y[4]?1:0)-(x[4]?1:0);}
  return d!==0?d:a-b;
}

function renderProd(){
  if(!elProdList){return;}
  var f=norm(elQ?elQ.value:"");
  prodIdx.sort(function(a,b){return cmpS(a,b,sortProd);});
  var h="";
  for(var k=0;k<prodIdx.length;k++){
    var r=SINGLES[prodIdx[k]];
    if(f!==""&&norm(r[0]).indexOf(f)<0){continue;}
    h+='<div class="card sm"><div class="ch"><div class="ct">'+r[0]+'</div></div>'+(r[4]?'<div class="tg"><span class="chip">인기</span></div>':'')+mts(sortProd==="val"?4:3,mt('소비자가',dash(r[1]))+mt('회원가',dash(r[2]))+mt('CV',r[3]>0?fmt(r[3]):'-')+(sortProd==="val"?mt('CV당 가격',won(Math.round(vper(r)))):''))+'</div>';
  }
  elProdList.innerHTML=h===""?'<div class="empty">검색 결과가 없습니다.</div>':h;
}

function buildPkg(){
  if(!elPkgList){return;}
  var h="";
  for(var t=1;t<=7;t++){
    var part="";
    for(var i=0;i<N;i++){
      var d=DATA[i];
      if(d&&d[5]>0&&tierOf(d[0])===t){
        part+='<div class="card"><div class="ch"><div class="ct">'+d[0]+'</div><div class="cr">'+(d[6]?'<span class="chip solid">'+parseFloat(d[6])+'% 할인</span>':'')+'</div></div>'+(d[7]?'<div class="cd">'+d[7]+'</div>':'')+'<div class="cd">'+d[4]+'</div>'+mts(4,mt('소비자가',won(d[2]))+mt('회원가',won(d[3]))+mt('패키지가',won(d[5]),1)+mt('CV',fmt(d[1])))+'</div>';
      }
    }
    if(part!==""){h+='<div class="gh">'+TIER_NAMES[t]+'</div>'+part;}
  }
  elPkgList.innerHTML=h;
}

function buildMg(){
  if(!elMgOut){return;}
  var h="";
  for(var g2=0;g2<MG_GROUPS.length;g2++){
    h+='<div class="gh">'+MG_TITLES[g2]+'</div>';
    for(var j=0;j<PN;j++){
      var p=PROGS[j];
      if(p[1]===MG_GROUPS[g2]){
        h+='<div class="card"><div class="ch"><div class="ct">'+p[0]+'</div></div><div class="cd">'+p[5]+'</div>'+mts(4,mt('회원가',won(p[2]))+mt('소비자가',won(p[3]))+mt('CV',fmt(p[4]))+mt('마진',won(p[3]-p[2]),1))+'</div>';
      }
    }
  }
  elMgOut.innerHTML=h;
}

function ezPrice(i){return Math.round(SINGLES[i][2]*0.9/10)*10;}
function ezNum(x){return (Math.round(x*10)/10).toString();}

function renderEz(){
  if(!elEzList||!elEzSum){return;}
  var cnt=0;
  var pay=0;
  var cv=0;
  for(var i=0;i<SN;i++){
    var q=ezQty[i];
    if(q>0){cnt+=q;pay+=ezPrice(i)*q;cv+=SINGLES[i][3]*q*0.9;}
  }
  elEzSum.innerHTML='<div class="ch"><div class="ct">선택 요약</div><div class="cr"><button type="button" class="btn ghost" data-a="r">수량 초기화</button></div></div>'+mts(3,mt('선택 수량',cnt+'개')+mt('이지원 금액',won(pay))+mt('이지원 CV',ezNum(cv),1));
  var f=norm(elEzQ?elEzQ.value:"");
  ezIdx.sort(function(a,b){return cmpS(a,b,sortEz);});
  var h="";
  for(var k=0;k<ezIdx.length;k++){
    var idx=ezIdx[k];
    var r=SINGLES[idx];
    if(f!==""&&norm(r[0]).indexOf(f)<0){continue;}
    var n=ezQty[idx];
    h+='<div class="card sm'+(n>0?' sel':'')+'"><div class="ch"><div class="ct">'+r[0]+'</div><div class="cr"><div class="step"><button type="button" data-a="m" data-i="'+idx+'" aria-label="수량 줄이기">−</button><span class="qn">'+n+'</span><button type="button" data-a="p" data-i="'+idx+'" aria-label="수량 늘리기">+</button></div></div></div>'+((r[4]||n>0)?'<div class="tg">'+(r[4]?'<span class="chip">인기</span>':'')+(n>0?'<span class="chip solid">×'+n+'</span>':'')+'</div>':'')+mts(2,mt('이지원가',won(ezPrice(idx)))+mt('CV',ezNum(r[3]*0.9),1))+'</div>';
  }
  elEzList.innerHTML=h===""?'<div class="empty">검색 결과가 없습니다.</div>':h;
}

for(var tb=0;tb<tabBtns.length;tb++){
  tabBtns[tb].addEventListener("click",function(){showTab(this.getAttribute("data-t"));});
}
if(elQ){elQ.addEventListener("input",renderProd);}
if(elSort){elSort.addEventListener("change",function(){sortProd=elSort.value;renderProd();});}
if(elEzQ){elEzQ.addEventListener("input",renderEz);}
if(elEzSort){elEzSort.addEventListener("change",function(){sortEz=elEzSort.value;renderEz();});}
if(elEzList){
  elEzList.addEventListener("click",function(e){
    var t=e?e.target:null;
    if(!t||!t.getAttribute){return;}
    var a=t.getAttribute("data-a");
    var ix=parseInt(t.getAttribute("data-i"),10);
    if(!a||isNaN(ix)||ix<0||ix>=SN){return;}
    if(a==="p"&&ezQty[ix]<99){ezQty[ix]++;}
    if(a==="m"&&ezQty[ix]>0){ezQty[ix]--;}
    renderEz();
  });
}
if(elEzSum){
  elEzSum.addEventListener("click",function(e){
    var t=e?e.target:null;
    if(t&&t.getAttribute&&t.getAttribute("data-a")==="r"){ezQty.fill(0);renderEz();}
  });
}
renderProd();
buildPkg();
buildMg();
renderEz();
</script>
</body>
</html>
