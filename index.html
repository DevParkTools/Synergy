<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시너지 제품 계산기</title>
<style>
:root{--bg:#f3f6f4;--card:#ffffff;--ink:#16302b;--sub:#5d726d;--line:#d9e3df;--main:#0f6b5c;--main-d:#0a4f44;--hi:#e8f3f0;--warn:#b4472f;--rad:10px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a18;--card:#17262a;--ink:#e6f0ed;--sub:#93aaa4;--line:#27403b;--main:#3fb8a2;--main-d:#2c9985;--hi:#1b312e;--warn:#e58b72}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.6rem;margin:8px 0 4px;letter-spacing:-0.02em}
.desc{margin:0 0 18px;color:var(--sub);font-size:.92rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
label.field{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.inrow{display:flex;gap:8px}
#budget{flex:1;min-width:0;font-size:1.25rem;padding:12px 14px;border:1px solid var(--line);border-radius:var(--rad);background:var(--bg);color:var(--ink);font-weight:600}
#budget:focus,#months:focus,#go:focus,.opt:focus-within{outline:2px solid var(--main);outline-offset:1px}
#go{padding:0 22px;border:0;border-radius:var(--rad);background:var(--main);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
#go:hover{background:var(--main-d)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:.9rem;cursor:pointer;user-select:none}
.opt input{accent-color:var(--main);margin:0}
.opt:has(input:checked){background:var(--hi);border-color:var(--main)}
#info{margin:16px 2px 8px;color:var(--sub);font-size:.9rem}
.res{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;margin-bottom:10px}
.res.top{border-color:var(--main);border-width:2px}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rk{font-weight:700;color:var(--main)}
.rem{font-weight:700}
.rem.zero{color:var(--main)}
.pk{margin:10px 0 0;padding:0;list-style:none}
.pk li{padding:8px 0;border-top:1px solid var(--line)}
.pn{font-weight:600}
.pc{font-size:.84rem;color:var(--sub);margin-top:2px}
.tabs{display:flex;gap:2px;margin:0 0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:1 0 auto;white-space:nowrap;padding:11px 12px;border:0;border-bottom:3px solid transparent;background:none;color:var(--sub);font-size:1rem;font-weight:600;cursor:pointer}
.tab.on{color:var(--main);border-bottom-color:var(--main)}
.tab:focus-visible{outline:2px solid var(--main);outline-offset:-2px}
.srch{width:100%;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:var(--rad);background:var(--bg);color:var(--ink)}
.tblw{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:.82rem;color:var(--sub);white-space:nowrap}
.tbl .n{text-align:right;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.mut{color:var(--sub)}
.bd{display:inline-block;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--hi);color:var(--main);font-size:.72rem;font-weight:700;vertical-align:1px}
.gt{margin:16px 2px 8px;font-weight:700;color:var(--sub);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.8rem;color:var(--sub)}
.grid b{display:block;color:var(--ink);font-size:.95rem}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
.ezsum{position:sticky;top:0;z-index:2;margin-top:12px}
.ezg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;font-size:.82rem;color:var(--sub)}
.ezg b{display:block;color:var(--ink);font-size:1rem}
.ezh{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:.88rem;color:var(--main);font-weight:600}
.st{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1.1rem;cursor:pointer;vertical-align:middle}
.st:focus-visible{outline:2px solid var(--main)}
.qn{display:inline-block;min-width:26px;text-align:center;font-weight:700;vertical-align:middle}
.tbl tr.sel td{background:var(--hi)}
.tbl tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--main)}
.tbl tr.sel .qn{color:var(--main);font-size:1.05rem}
.qb{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:999px;background:var(--main);color:var(--card);font-size:.8rem;font-weight:700;vertical-align:1px}
.ezreset{display:block;margin:12px auto 0;padding:10px 18px;border:1px solid var(--line);border-radius:var(--rad);background:var(--card);color:var(--sub);font-size:.9rem;cursor:pointer}
[hidden]{display:none!important}
#months{flex:none;width:76px;font-size:1.25rem;padding:12px 8px;border:1px solid var(--line);border-radius:var(--rad);background:var(--bg);color:var(--ink);font-weight:600;text-align:center}
.suf{align-self:center;color:var(--sub);font-size:.95rem}
.sgh{font-size:.84rem;color:var(--main);font-weight:700;border-top:1px solid var(--line);padding-top:8px}
.sum{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.95rem}
.sum b{font-size:1.05rem}
.empty{background:var(--card);border:1px dashed var(--warn);border-radius:var(--rad);padding:16px;color:var(--warn);font-weight:600}
@media (max-width:480px){h1{font-size:1.35rem}#go{padding:0 16px}}
</style>
</head>
<body>
<div class="wrap">
<h1>시너지 제품 계산기</h1>
<p class="desc">금액을 입력하면 예산에 가장 가까운 패키지 구성과 총 CV를 보여줍니다.</p>
<div class="tabs" role="tablist">
<button type="button" class="tab on" data-t="calc" role="tab">계산기</button>
<button type="button" class="tab" data-t="prod" role="tab">제품별 가격</button>
<button type="button" class="tab" data-t="pkg" role="tab">패키지</button>
<button type="button" class="tab" data-t="ez" role="tab">이지원</button>
<button type="button" class="tab" data-t="mg" role="tab">원팩</button>
</div>
<section id="v-calc">
<div class="panel">
<label class="field" for="budget" id="lblBudget">예산 (원)</label>
<div class="inrow">
<input id="budget" type="text" inputmode="numeric" autocomplete="off" placeholder="예: 1,000,000">
<input id="months" type="number" inputmode="numeric" min="1" max="60" value="6" aria-label="개월 수" hidden>
<span id="mSuf" class="suf" hidden>개월</span>
<button id="go" type="button">계산</button>
</div>
<div class="opts">
<label class="opt"><input type="radio" name="im" value="t" checked>총 금액</label>
<label class="opt"><input type="radio" name="im" value="m">월 금액 × 개월</label>
</div>
</div>
<div id="info"></div>
<div id="out"></div>
</section>
<section id="v-prod" hidden>
<div class="panel">
<label class="field" for="q">제품 검색</label>
<input id="q" class="srch" type="text" autocomplete="off" placeholder="제품명 입력">
<label class="field" for="sortSel" style="margin-top:12px">정렬</label>
<select id="sortSel" class="srch">
<option value="pop">인기순</option>
<option value="cv">CV 높은순</option>
<option value="cvl">CV 낮은순</option>
<option value="pl">가격 낮은순</option>
<option value="ph">가격 높은순</option>
<option value="name">이름순</option>
<option value="val">가성비순 (CV당 가격)</option>
</select>
</div>
<div class="tblw"><table class="tbl"><thead><tr><th>제품명</th><th class="n">소비자가</th><th class="n">회원가</th><th class="n">CV</th></tr></thead><tbody id="prodBody"></tbody></table></div>
</section>
<section id="v-pkg" hidden>
<div id="pkgBody"></div>
</section>
<section id="v-mg" hidden>
<div class="pc" style="margin:0 2px 10px">마진은 소비자가에서 회원가를 뺀 금액입니다.</div>
<div id="mgOut"></div>
</section>
<section id="v-ez" hidden>
<div class="panel">
<div class="pc">이지원(정기 구독)은 회원가 기준 10% 할인입니다.</div>
<input id="ezq" class="srch" type="text" autocomplete="off" placeholder="제품 검색" style="margin-top:10px">
</div>
<div id="ezSum" class="res ezsum"></div>
<div class="tblw"><table class="tbl"><thead><tr><th>제품명</th><th class="n">이지원가</th><th class="n">CV</th><th class="n">수량</th></tr></thead><tbody id="ezBody"></tbody></table></div>
<button type="button" id="ezReset" class="ezreset">수량 초기화</button>
</section>
</div>

function fmt(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");}

function gcd(a,b){
  while(b){var t=a%b;a=b;b=t;}
  return a;
}

function getIm(){
  if(!elIm){return "t";}
  for(var k=0;k<elIm.length;k++){
    if(elIm[k].checked){return elIm[k].value;}
  }
  return "t";
}

function syncIm(){
  var m=getIm()==="m";
  if(elMonths){elMonths.hidden=!m;}
  if(elSuf){elSuf.hidden=!m;}
  if(elLbl){elLbl.textContent=m?"월 금액 (원) × 개월":"예산 (원)";}
  if(elBudget){elBudget.placeholder=m?"예: 300,000":"예: 1,000,000";}
}

function tierOf(n){
  if(n.indexOf("슈퍼")>=0){return 7;}
  if(n.indexOf("메가 원팩 16")>=0){return 1;}
  if(n.indexOf("메가 원팩 12")>=0){return 2;}
  if(n.indexOf("메가 원팩 8")>=0){return 3;}
  if(n.indexOf("메가 원팩 4")>=0){return 4;}
  if(n.indexOf("7일 원팩")>=0){return 5;}
  return 6;
}

function ensureCands(){
  if(candReady){return;}
  for(var i=0;i<N;i++){
    var d=DATA[i];
    if(d&&d[5]>0){
      cName.push(d[0]);cTier.push(tierOf(d[0]));cPay.push(d[5]);cCon.push(d[2]);cMem.push(d[3]);cCv.push(d[1]);cDesc.push(d[4]);cNote.push(d[7]||"");cKind.push(1);
    }
  }
  for(var p=0;p<PROGS.length;p++){
    var r=PROGS[p];
    cName.push(r[0]);cTier.push(tierOf(r[0]));cPay.push(r[2]);cCon.push(r[3]);cMem.push(r[2]);cCv.push(r[4]);cDesc.push(r[5]);cNote.push("");cKind.push(0);
  }
  candReady=true;
}

function prepSingles(){
  sPrice.length=0;sUnit.length=0;sCv.length=0;sName.length=0;sPop.length=0;sCon.length=0;
  g=0;
  for(var i=0;i<SN;i++){
    var row=SINGLES[i];
    if(!row){continue;}
    var p=row[2];
    if(p>0&&row[1]>0){sPrice.push(p);sCv.push(row[3]);sName.push(row[0]);sPop.push(row[4]?1:0);sCon.push(row[1]);g=gcd(g,p);}
  }
  K=sPrice.length;
  if(K===0||g<=0){useSingles=false;return;}
  iUnit.length=0;iCv.length=0;iScore.length=0;iBase.length=0;iMul.length=0;
  for(var k=0;k<K;k++){
    sUnit[k]=sPrice[k]/g;
    var w=sPop[k]?POPW:1;
    for(var m=1;m<=2;m++){
      iUnit.push(sUnit[k]*m);iCv.push(sCv[k]*m);iScore.push(sCv[k]*m*w);iBase.push(k);iMul.push(m);
    }
  }
  KI=iUnit.length;
  U=Math.floor(Math.min(budget,CAP)/g);
  var W=U+1;
  dpscore=new Int32Array(W).fill(-1);
  dpreal=new Int32Array(W);
  dpscore[0]=0;
  take=new Uint8Array(KI*W);
  bs=new Int32Array(W);
  scnt=new Int32Array(K);
  for(var t=0;t<KI;t++){
    var u=iUnit[t];
    var cvv=iCv[t];
    var sc=iScore[t];
    var off=t*W;
    for(var s=U;s>=u;s--){
      var pv=dpscore[s-u];
      if(pv>=0){
        var v=pv+sc;
        if(v>dpscore[s]){dpscore[s]=v;dpreal[s]=dpreal[s-u]+cvv;take[off+s]=1;}
      }
    }
  }
  for(var q=1;q<=U;q++){bs[q]=dpscore[q]>=0?q:bs[q-1];}
}

function fillCalc(left,cv){
  fRem=left;
  fCv=cv;
  if(useSingles){
    var x=Math.floor(left/g);
    if(x>U){x=U;}
    var sv=bs[x];
    fRem=left-sv*g;
    fCv=cv+dpreal[sv];
  }
}

function addRec(ci,k,rem,cv,left){
  recC.push(ci);recK.push(k);recRem.push(rem);recCv.push(cv);recLeft.push(left);
}

function buildRecs(){
  recC.length=0;recK.length=0;recRem.length=0;recCv.length=0;recLeft.length=0;
  var nc=cPay.length;
  for(var t=1;t<=7&&recC.length<REC_MAX;t++){
    var bi=-1;
    for(var c=0;c<nc;c++){
      if(cTier[c]!==t||cPay[c]>budget){continue;}
      if(bi<0||cCon[c]>cCon[bi]||(cCon[c]===cCon[bi]&&cPay[c]<cPay[bi])){bi=c;}
    }
    if(bi<0){continue;}
    var maxk=Math.min(Math.floor(budget/cPay[bi]),MAXK);
    var bk=0;
    var brem=0;
    var bcv=0;
    var bleft=0;
    for(var k=maxk;k>=1;k--){
      var left=budget-k*cPay[bi];
      fillCalc(left,cCv[bi]*k);
      if(bk===0||fRem<brem){bk=k;brem=fRem;bcv=fCv;bleft=left;}
    }
    addRec(bi,bk,brem,bcv,bleft);
  }
  if(recC.length===0&&useSingles){
    fillCalc(budget,0);
    if(fCv>0){addRec(-1,0,fRem,fCv,budget);}
  }
}

function buildCard(j){
  var ci=recC[j];
  var k=recK[j];
  var rem=recRem[j];
  var cv=recCv[j];
  var total=budget-rem;
  var conSum=0;
  var memSum=0;
  var body="";
  if(ci>=0){
    conSum=cCon[ci]*k;
    memSum=cMem[ci]*k;
    body+='<li><div class="pn">'+cName[ci]+' × '+k+'</div>'+(cNote[ci]?'<div class="pc">'+cNote[ci]+'</div>':'')+'<div class="pc">'+cDesc[ci]+'</div>';
    if(cKind[ci]===1&&cMem[ci]>cPay[ci]){
      body+='<div class="pc">패키지가 적용 · 회원가 합계 대비 '+fmt((cMem[ci]-cPay[ci])*k)+'원 절약</div>';
    }
    body+='</li>';
  }
  if(useSingles){
    var x=Math.floor(recLeft[j]/g);
    if(x>U){x=U;}
    var sv=bs[x];
    scnt.fill(0);
    var W=U+1;
    for(var t=KI-1;t>=0&&sv>0;t--){
      if(take[t*W+sv]===1){
        scnt[iBase[t]]+=iMul[t];
        sv-=iUnit[t];
      }
    }
    var sb="";
    for(var m=0;m<K;m++){
      if(scnt[m]>0){
        conSum+=sCon[m]*scnt[m];
        memSum+=sPrice[m]*scnt[m];
        sb+='<li><div class="pn">'+sName[m]+(sPop[m]?'<span class="bd">인기</span>':'')+' × '+scnt[m]+'</div></li>';
      }
    }
    if(sb!==""){body+='<li class="sgh">단품 추가</li>'+sb;}
  }
  var extra='<div class="pc" style="margin-top:8px">마진 = 소비자가 − 회원가 합계 ('+fmt(memSum)+'원)</div>';
  if(isMonthly&&months>0){extra+='<div class="pc">월 평균 '+fmt(Math.round(total/months))+'원 · '+months+'개월</div>';}
  var title='추천 '+(j+1)+(ci>=0?'':' · 단품 구성');
  return '<div class="res'+(j===0?' top':'')+'"><div class="rh"><span class="rk">'+title+'</span><span class="rem'+(rem===0?' zero':'')+'">남은 금액 : '+fmt(rem)+'원</span></div><ul class="pk">'+body+'</ul><div class="sum"><span>합계 <b>'+fmt(total)+'원</b></span><span>총 CV <b>'+fmt(cv)+'</b></span><span>소비자가로는 <b>'+fmt(conSum)+'원</b></span><span>마진 <b>'+fmt(conSum-memSum)+'원</b></span></div>'+extra+'</div>';
}

  if(elInfo){elInfo.textContent="";}
  if(elOut){elOut.innerHTML='<div class="empty">'+t+'</div>';}

function calc(){
  if(!elBudget||!elOut||!elInfo){return;}
  syncIm();
  isMonthly=getIm()==="m";
  var raw=elBudget.value?elBudget.value.replace(/[^0-9]/g,""):"";
  var val=raw===""?0:parseInt(raw,10);
  if(isMonthly){
    monthly=val;
    months=elMonths?parseInt(elMonths.value,10):0;
    if(!monthly||monthly<=0){showMsg("월 금액을 입력해 주세요.");return;}
    if(!months||months<1){showMsg("개월 수를 입력해 주세요.");return;}
    if(months>60){months=60;}
    budget=monthly*months;
  }else{
    monthly=0;
    months=0;
    budget=val;
    if(!budget||budget<=0){showMsg("예산을 입력해 주세요.");return;}
  }
  ensureCands();
  useSingles=true;
  prepSingles();
  buildRecs();
  elInfo.textContent=isMonthly?"월 "+fmt(monthly)+"원 × "+months+"개월 = 총 "+fmt(budget)+"원 · 회원가 기준":"회원가 기준";
  if(recC.length===0){
    elOut.innerHTML='<div class="empty">추천 가능한 구성이 없습니다. 남은 금액 : '+fmt(budget)+'원</div>';
    return;
  }
  var html="";
  for(var j=0;j<recC.length;j++){html+=buildCard(j);}
  elOut.innerHTML=html;
}

function prodPrice(r){return r[2]>0?r[2]:r[1];}

function prodVal(r){
  var p=prodPrice(r);
  return (r[3]>0&&p>0)?p/r[3]:1000000000;
}

function prodCmp(a,b){
  var x=SINGLES[a];
  var y=SINGLES[b];
  var d=0;
  if(sortMode==="cv"){d=y[3]-x[3];}
  else if(sortMode==="cvl"){d=x[3]-y[3];}
  else if(sortMode==="pl"){d=prodPrice(x)-prodPrice(y);}
  else if(sortMode==="ph"){d=prodPrice(y)-prodPrice(x);}
  else if(sortMode==="name"){d=x[0].localeCompare(y[0],"ko");}
  else if(sortMode==="val"){d=prodVal(x)-prodVal(y);}
  else{d=(y[4]?1:0)-(x[4]?1:0);}
  return d!==0?d:a-b;
}

function buildProd(filter){
  if(!elProd){return;}
  var f=filter?filter.replace(/\s+/g,"").toLowerCase():"";
  var h="";
  prodIdx.sort(prodCmp);
  for(var k=0;k<prodIdx.length;k++){
    var r=SINGLES[prodIdx[k]];
    if(!r){continue;}
    if(f!==""&&r[0].replace(/\s+/g,"").toLowerCase().indexOf(f)<0){continue;}
    var nm=r[0]+(r[4]?'<span class="bd">인기</span>':'');
    if(r[1]===0&&r[2]===0){
      h+='<tr><td>'+nm+'</td><td colspan="3" class="mut">가격·CV 입력 필요</td></tr>';
    }else{
      if(sortMode==="val"){nm+='<div class="pc">CV당 약 '+fmt(Math.round(prodVal(r)))+'원 (회원가)</div>';}
      h+='<tr><td>'+nm+'</td><td class="n">'+dash(r[1])+'</td><td class="n">'+dash(r[2])+'</td><td class="n">'+r[3]+'</td></tr>';
    }
  }
  elProd.innerHTML=h===""?'<tr><td colspan="4" class="mut">검색 결과가 없습니다.</td></tr>':h;
}

}

  }

}

    if(a==="p"&&ezQty[ix]<99){ezQty[ix]++;}
    if(a==="m"&&ezQty[ix]>0){ezQty[ix]--;}
    ezRender();
  });
